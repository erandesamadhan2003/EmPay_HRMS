version: '3.8'
services:
  database:
    image: postgres:15
    env_file:
      - .env.dev
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:6-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    env_file:
      - .env.dev
    volumes:
      - redis_data:/data

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    env_file:
      - .env.dev
    ports:
      - "3000:3000"
    volumes:
      - ./backend:/app
    command: ["bun", "run", "start"]
    depends_on:
      - database
      - redis

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    env_file:
      - .env.dev
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
    command: ["bun", "run", "dev", "--", "--host"]
    depends_on:
      - backend

volumes:
  db_data:
  redis_data:

