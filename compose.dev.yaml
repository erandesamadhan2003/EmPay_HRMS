services:
    database:
        image: postgres:15
        env_file:
            - .env.dev
        environment:
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
            POSTGRES_DB: ${POSTGRES_DB}
        volumes:
            - db_data:/var/lib/postgresql/data
        networks:
            - database_network

    redis:
        image: redis:6-alpine
        command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
        env_file:
            - .env.dev
        volumes:
            - redis_data:/data
        networks:
            - redis_network

    backend:
        build:
            context: ./backend
        env_file:
            - .env.dev
        ports:
            - "3000:3000"
        volumes:
            - ./backend:/app
            - /app/node_modules
        command: ["bun", "run", "start"]
        depends_on:
            - database
            - redis
        networks:
            - backend_network
            - database_network
            - redis_network

    frontend:
        build:
            context: ./frontend
        env_file:
            - .env.dev
        ports:
            - "5173:5173"
        volumes:
            - ./frontend:/app
            - /app/node_modules
        command: ["bun", "run", "dev", "--", "--host"]
        depends_on:
            - backend
        networks:
            - frontend_network
            - backend_network

volumes:
    db_data:
    redis_data:

networks:
    database_network:
        driver: bridge
        internal: true
    redis_network:
        driver: bridge
        internal: true
    backend_network:
        driver: bridge
        internal: true
    frontend_network:
        driver: bridge
