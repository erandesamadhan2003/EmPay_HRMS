global:
    namespace: empayhrms
    project: empayhrms

# Backend Configuration
backend:
    image:
        repository: empayhrmsacr.azurecr.io/backend
        tag: latest
        pullPolicy: Always

    replicas: 2
    port: 3000

    resources:
        requests:
            cpu: 100m
            memory: 256Mi
        limits:
            cpu: 500m
            memory: 512Mi

    # Horizontal Pod AutoScaler
    hpa:
        minReplicas: 2
        maxReplicas: 5
        cpuTargetPercent: 70

# Frontend Configuration
frontend:
    image:
        repository: empayhrmsacr.azurecr.io/frontend
        tag: latest
        pullPolicy: Always

    replicas: 2
    port: 80

    resources:
        requests:
            cpu: 50m
            memory: 128Mi
        limits:
            cpu: 200m
            memory: 256Mi

# PostgreSQL Configuration
postgres:
    image: postgres:15
    port: 5432

    database: empayhrms
    username: empay

    storage: 10Gi
    storageClass: managed-csi # AKS default Azure Disk CSI driver

    resources:
        requests:
            cpu: 100m
            memory: 256Mi
        limits:
            cpu: 500m
            memory: 512Mi

# Redis Configuration
redis:
    image: redis:6-alpine
    port: 6379

    storage: 2Gi
    storageClass: managed-csi

    resources:
        requests:
            cpu: 50m
            memory: 64Mi
        limits:
            cpu: 200m
            memory: 128Mi

# Application Configuration
config:
    nodeEnv: production

    dbHost: postgres-svc
    dbPort: 5432
    dbName: empayhrms

    redisHost: redis-svc
    redisPort: 6379
    redisCacheEnabled: false

    groqModel: llama-3.3-70b-versatile

    viteApiBaseUrl: /api
    viteAppName: EmPay


# Secret Configuration
secrets:
    groqApiKey: "" # Handled via values.secrets.yaml
    viteGroqApiKey: "" # Handled via values.secrets.yaml
    smtpPass: "" # Handled via values.secrets.yaml
    smtpUser: "" # Handled via values.secrets.yaml


# KeyVault Configuration
keyvault:
    name: "empayhrms-kv-seir1z"
    tenantId: "848e3385-b0eb-414e-bc12-28308655452a"
    managedIdentityClientId: "040276d6-41af-47a4-8d07-b9c159291e59"

# ingress Configuration
ingress:
    enabled: true
    className: nginx
    host: 20.207.98.44
    tls: false
