apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
    name: {{ printf "%s-kv-secrets" .Values.global.project }}
    namespace: {{ .Values.global.namespace }}
    labels:
        app.kubernetes.io/component: secret-provider
{{- include "empayhrms.labels" . | nindent 8 }}
spec:
    provider: azure
    
    secretObjects:
      - secretName: {{ printf "%s-kv-secrets" .Values.global.project }}
        type: Opaque
        data:
          - objectName: jwt-secret
            key: JWT_SECRET
          - objectName: postgres-password
            key: DB_PASSWORD
          - objectName: redis-password
            key: REDIS_PASSWORD

    parameters:
        usePodIdentity: "false"
        useVMManagedIdentity: "true"
        userAssignedIdentityID: {{ .Values.keyvault.managedIdentityClientId | quote }}
        keyvaultName: {{ .Values.keyvault.name | quote }}
        tenantId: {{ .Values.keyvault.tenantId | quote }}
        
        objects: |
            array:
              - |
                objectName: jwt-secret
                objectType: secret
              - |
                objectName: postgres-password
                objectType: secret
              - |
                objectName: redis-password
                objectType: secret
