apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ printf "%s-ingress" .Values.global.project }}
    namespace: {{ .Values.global.namespace }}
    labels:
        app.kubernetes.io/component: ingress
{{- include "empayhrms.labels" . | nindent 8 }}
    annotations:
        nginx.ingress.kubernetes.io/rewrite-target: /
        nginx.ingress.kubernetes.io/proxy-body-size: "10m"

spec:
    ingressClassName: nginx

    rules:
        - http:
              paths:
                  - path: /api
                    pathType: Prefix
                    backend:
                        service:
                            name: backend-svc
                            port:
                                number: 3000

                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: frontend-svc
                            port:
                                number: 80
