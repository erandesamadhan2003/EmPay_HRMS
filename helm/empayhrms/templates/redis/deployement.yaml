apiVersion: apps/v1
kind: Deployment
metadata: 
    name: {{ printf "%s-redis-deployment" .Values.global.project }}
    namespace: {{ .Values.global.namespace }}
    labels: 
        app.kubernetes.io/component: redis-deployment
{{- include "empayhrms.labels" . | nindent 8 }}

spec: 
    replicas: 1
    selector: 
        matchLabels: 
            app: redis

    template: 
        metadata:
            labels:
                app: redis
        spec:
            containers: 
              - name: redis
                image: {{ .Values.redis.image }}

                command:
                  - redis-server
                  - --requirepass
                  - $(REDIS_PASSWORD)

                ports: 
                  - containerPort: {{ .Values.redis.port }}

                env: 
                  - name: REDIS_PASSWORD
                    valueFrom:
                        secretKeyRef:
                            name: {{ printf "%s-kv-secrets" .Values.global.project }}
                            key: REDIS_PASSWORD
                
                volumeMounts: 
                  - name: redis-data
                    mountPath: /data
                  - name: secrets-store
                    mountPath: /mnt/secrets-store
                    readOnly: true

                resources:
                    requests:
                        cpu: {{ .Values.redis.resources.requests.cpu }}
                        memory: {{ .Values.redis.resources.requests.memory }}
                    limits:
                        cpu: {{ .Values.redis.resources.limits.cpu }}
                        memory: {{ .Values.redis.resources.limits.memory }}

                livenessProbe:
                    exec: 
                        command: 
                          - sh 
                          - -c
                          - redis-cli -a $REDIS_PASSWORD ping
                    initialDelaySeconds: 20
                    periodSeconds: 20
                    failureThreshold: 3
                
                readinessProbe: 
                    exec: 
                        command:
                          - sh
                          - -c
                          - redis-cli -a $REDIS_PASSWORD ping
                    initialDelaySeconds: 10
                    periodSeconds: 10
                    failureThreshold: 3

            volumes: 
              - name: redis-data  
                persistentVolumeClaim:
                    claimName: {{ printf "%s-redis-pvc" .Values.global.project }}
              - name: secrets-store
                csi: 
                    driver: secrets-store.csi.k8s.io
                    readOnly: true
                    volumeAttributes:
                        secretProviderClass: {{ printf "%s-kv-secrets" .Values.global.project }}
                
