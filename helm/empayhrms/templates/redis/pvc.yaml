apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: {{ printf "%s-redis-pvc" .Values.global.project }}
    namespace: {{ .Values.global.namespace }}
    labels:
        app.kubernetes.io/component: redis-pvc
{{- include "empayhrms.labels" . | nindent 8 }}
spec:
    accessModes:
        - ReadWriteOnce
    storageClassName: {{ .Values.redis.storageClass }}
    resources:
        requests:
            storage: {{ .Values.redis.storage }}