name: DEPLOY

on:
    workflow_run:
        workflows: ["BUILD_AND_PUSH"]
        branches: [main]
        types:
            - completed

jobs:
    deploy:
        name: Deploy to AKS via Helm
        runs-on: ubuntu-latest
        if: ${{ github.event.workflow_run.conclusion == 'success' }}

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Login to Azure
              uses: azure/login@v2
              with:
                  creds: |
                      {
                        "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
                        "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
                        "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
                        "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
                      }

            - name: Get AKS credentials
              run: |
                  az aks get-credentials \
                    --resource-group empayhrms-rg \
                    --name empayhrms-aks \
                    --overwrite-existing

            - name: Set up Helm
              uses: azure/setup-helm@v4
              with:
                  version: "v3.16.0"

            - name: Write Helm secrets values
              run: |
                  echo "${{ secrets.HELM_VALUES_SECRETS }}" > /tmp/values.secrets.yaml

            - name: Helm upgrade --install
              run: |
                  helm upgrade --install empayhrms ./helm/empayhrms \
                    --namespace empayhrms \
                    --create-namespace \
                    -f ./helm/empayhrms/values.yaml \
                    -f /tmp/values.secrets.yaml \
                    --set backend.image.tag=${{ github.event.workflow_run.head_sha }} \
                    --set frontend.image.tag=${{ github.event.workflow_run.head_sha }} \
                    --atomic \
                    --wait \
                    --timeout 5m

            - name: Verify backend rollout
              run: |
                  kubectl rollout status deployment/empayhrms-backend \
                    --namespace empayhrms \
                    --timeout=120s

            - name: Verify frontend rollout
              run: |
                  kubectl rollout status deployment/empayhrms-frontend \
                    --namespace empayhrms \
                    --timeout=120s

            - name: Remove secrets values file
              if: always()
              run: rm -f /tmp/values.secrets.yaml
