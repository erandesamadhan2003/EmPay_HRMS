name: CI

on:
    push:
        branches:
            - main
            - develop
    pull_request:
        branches:
            - main

jobs:
    ci-backend:
        name: Backend — lint & test
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.3"

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: backend

            - name: Run tests
              run: bun test
              working-directory: backend

    ci-frontend:
        name: Frontend — lint, test 
        runs-on: ubuntu-latest

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version: "1.3.3"

            - name: Install dependencies
              run: bun install --frozen-lockfile
              working-directory: frontend

            - name: Run tests
              run: bun test
              working-directory: frontend

